<div class="date-picker">
  <button
    [id]="inputId"
    type="button"
    class="date-trigger"
    [class.input--invalid]="invalid"
    [class.date-trigger--open]="isOpen"
    [disabled]="isDisabled"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="dialog"
    (click)="toggle()">
    <span class="date-trigger__value" [class.date-trigger__value--empty]="!value">{{ displayValue || placeholder }}</span>
    <svg class="date-trigger__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
      <line x1="16" y1="2" x2="16" y2="6" />
      <line x1="8" y1="2" x2="8" y2="6" />
      <line x1="3" y1="10" x2="21" y2="10" />
    </svg>
  </button>

  @if (isOpen) {
    <div class="date-popover" role="dialog" aria-label="Choose birth date">
      <div class="date-popover__header">
        <button type="button" class="date-nav" (click)="prevMonth()" [disabled]="!canGoPrev" aria-label="Previous month">‹</button>
        <div class="date-popover__title">
          <span class="date-month">{{ monthLabel }}</span>
          <select class="date-year" (change)="onYearChange($event)" aria-label="Select year">
            @for (year of years; track year) {
              <option [value]="year" [selected]="year === viewYear">{{ year }}</option>
            }
          </select>
        </div>
        <button type="button" class="date-nav" (click)="nextMonth()" [disabled]="!canGoNext" aria-label="Next month">›</button>
      </div>

      <div class="date-weekdays">
        @for (label of weekDays; track label) {
          <span>{{ label }}</span>
        }
      </div>

      <div class="date-grid">
        @for (day of days; track $index) {
          @if (day) {
            <button
              type="button"
              class="date-day"
              [class.date-day--selected]="day.isSelected"
              [class.date-day--today]="day.isToday"
              [class.date-day--muted]="day.isDisabled"
              [disabled]="day.isDisabled"
              (click)="selectDay(day)">
              {{ day.day }}
            </button>
          } @else {
            <span class="date-day date-day--empty"></span>
          }
        }
      </div>

      <div class="date-popover__footer">
        <button type="button" class="date-clear" (click)="clear()">Clear</button>
      </div>
    </div>
  }
</div>
